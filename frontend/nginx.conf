# конфигурация nginx для отдачи собранного SPA и проксирования запросов к бэкенду
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # vue-router работает в history-режиме – на любой неизвестный путь отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # запросы фронтенда на /api/... уходят на контейнер бэкенда внутри docker-сети
    location /api/ {
        # по умолчанию nginx режет тело запроса на 1 МБ – бэкенд же принимает файлы до 8 МБ
        client_max_body_size 8m;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
